name: Phase 2 Review Ledger Reconcile

on:
  push:
    branches:
      - 'agent/phase2-*'
    paths:
      - 'operations/quality-rebase/phase2/reviews/**'
      - 'operations/quality-rebase/phase2/primary-reviews/**'
      - 'operations/quality-rebase/phase2/independent/**'
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/**'
      - 'operations/quality-rebase/phase2/effective-status-v1.json'
      - 'operations/quality-rebase/phase2/completion-ledger-audit-v1.json'
      - 'operations/quality-rebase/phase2/queue-coverage-audit-v1.json'
      - 'scripts/validate_phase2_primary_review_ledger_v1.py'
      - 'scripts/validate_phase2_primary_review_ledger_v2.py'
      - 'scripts/audit_phase2_completion_ledger.py'
      - 'scripts/audit_phase2_queue_coverage.py'
      - 'scripts/build_phase2_remaining_exception_queue.py'
      - '.github/workflows/phase2-review-ledger-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-review-ledger-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current working branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check canonical validator syntax
        run: python -m py_compile scripts/validate_phase2_primary_review_ledger_v1.py scripts/validate_phase2_primary_review_ledger_v2.py

      - name: Validate canonical append-only review ledger
        run: python scripts/validate_phase2_primary_review_ledger_v2.py --repo-root .

      - name: Audit completion and remaining queue reconciliation
        run: |
          set -euo pipefail
          python scripts/audit_phase2_completion_ledger.py
          python scripts/audit_phase2_queue_coverage.py
          python scripts/build_phase2_remaining_exception_queue.py

      - name: Confirm validation is read-only
        run: git diff --exit-code

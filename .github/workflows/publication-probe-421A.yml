name: Publication probe 421A

on:
  push:
    branches:
      - agent/publication-probe-421A

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 421A bundle object and build path
        shell: bash
        run: |
          set -u
          echo '=== GIT GREP 421A ==='
          git grep -n -I -E '421A|ムービン・ストラテジック・キャリア' -- ':!site/data/bundle.gz.part*' ':!site/data/frontend/*.gz' | head -n 300 || true
          echo '=== BUNDLE BUILD REFERENCES ==='
          git grep -n -I 'bundle.manifest.json' -- scripts .github package.json README.md docs 2>/dev/null | head -n 200 || true
          echo '=== FRONTEND BUILD REFERENCES ==='
          git grep -n -I -E 'build_frontend_data_shards|data:frontend|company-index.json.gz' -- scripts .github package.json README.md docs 2>/dev/null | head -n 200 || true

          python3 - <<'PY'
          import gzip, json, pathlib
          manifest=json.loads(pathlib.Path('site/data/bundle.manifest.json').read_text())
          raw=b''.join((pathlib.Path('site/data')/p['file']).read_bytes() for p in manifest['parts'])
          bundle=json.loads(gzip.decompress(raw))
          company=next(c for c in bundle['companies'] if str(c.get('code'))=='421A')
          print('=== BUNDLE MANIFEST ===')
          print(json.dumps({k:manifest.get(k) for k in ['sha256','companyCount','progressCount','compressedBytes','uncompressedBytes']},ensure_ascii=False,indent=2))
          print('=== BUNDLE 421A FULL ===')
          print(json.dumps(company,ensure_ascii=False,indent=2))
          print('=== BUNDLE KEYS ===')
          print(sorted(bundle.keys()))
          PY

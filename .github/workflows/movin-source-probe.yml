name: Movin source probe

on:
  push:
    branches:
      - agent/movin-source-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify corrected Movin PDF identity and deletion scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          cat > /tmp/probe.py <<'PY'
          import hashlib, io
          import requests
          from pypdf import PdfReader

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          urls={
            'corrected':'https://contents.xj-storage.jp/xcontents/AS09259/46652e9d/01a6/4eac/9e2f/d2f95cfb93c6/140120260317583980.pdf',
            'original':'https://www2.jpx.co.jp/disc/421A0/140120260317583980.pdf',
            'correction_notice':'https://www2.jpx.co.jp/disc/421A0/140120260324588022.pdf'
          }
          docs={}
          for name,u in urls.items():
              r=s.get(u,timeout=45); r.raise_for_status()
              assert r.content.startswith(b'%PDF'), (name,r.headers.get('content-type'),len(r.content))
              sha=hashlib.sha256(r.content).hexdigest(); reader=PdfReader(io.BytesIO(r.content))
              docs[name]=(r.content,reader)
              print('PDF',name,'PAGES',len(reader.pages),'BYTES',len(r.content),'SHA256',sha,'URL',u)
          original=docs['original'][1]; corrected=docs['corrected'][1]
          print('=== PAGE TEXT HASH COMPARISON ===')
          def norm(page):
              return ''.join((page.extract_text() or '').split())
          oh=[hashlib.sha256(norm(p).encode()).hexdigest() for p in original.pages]
          ch=[hashlib.sha256(norm(p).encode()).hexdigest() for p in corrected.pages]
          # Find exact text-hash alignment allowing one deleted page in original.
          mismatches=[]
          for ci,h in enumerate(ch):
              oi=ci if ci<14 else ci+1
              if oi>=len(oh) or h!=oh[oi]: mismatches.append((ci+1,oi+1 if oi<len(oh) else None))
          print('EXPECTED_DELETE_ORIGINAL_PDF_PAGE',15)
          print('ALIGNED_MISMATCHES',mismatches)
          print('ORIGINAL_PAGE15_TEXT', (original.pages[14].extract_text() or '')[:2000].replace('\n',' | '))
          print('CORRECTED_PAGE15_TEXT', (corrected.pages[14].extract_text() or '')[:1200].replace('\n',' | '))
          print('NOTICE_TEXT', (docs['correction_notice'][1].pages[0].extract_text() or '')[:3000].replace('\n',' | '))
          PY
          python3 /tmp/probe.py

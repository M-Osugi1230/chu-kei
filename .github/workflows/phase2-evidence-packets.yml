name: Phase 2 Evidence Packets

on:
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'scripts/build_phase2_review_evidence_packets.py'
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - '.github/workflows/phase2-evidence-packets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-evidence-packets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/quality-rebase-phase0-2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebase on latest branch
        run: git pull --rebase origin agent/quality-rebase-phase0-2

      - name: Build non-approving evidence packets
        run: python scripts/build_phase2_review_evidence_packets.py

      - name: Commit generated packets
        run: |
          if git diff --quiet -- operations/quality-rebase/phase2/evidence-packets; then
            echo 'No evidence packet changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/quality-rebase/phase2/evidence-packets
          git commit -m 'quality: assigned企業のページ別証跡パケットを生成'
          git push origin HEAD:agent/quality-rebase-phase0-2

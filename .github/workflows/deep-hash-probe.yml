name: Deep hash probe

on:
  push:
    branches:
      - agent/deep-verification-probe

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official PDFs and print immutable identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 - <<'PY'
          import hashlib, io
          import requests
          from pypdf import PdfReader
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          urls={
            'openup_current':'https://www.openupgroup.co.jp/_assets/pdf/ir/Medium-Term%20Management%20Policy.pdf',
            'shi_revision':'https://www.shi.co.jp/info/2025/6kgpsq000000nry1-att/6kgpsq000000nryo.pdf'
          }
          for name,u in urls.items():
              r=s.get(u,timeout=45); r.raise_for_status()
              assert r.content.startswith(b'%PDF'), (name,r.status_code,r.headers.get('content-type'),len(r.content))
              pages=len(PdfReader(io.BytesIO(r.content)).pages)
              print('PDF',name,'PAGES',pages,'BYTES',len(r.content),'SHA256',hashlib.sha256(r.content).hexdigest(),'URL',u)
          PY

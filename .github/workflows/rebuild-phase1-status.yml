name: Rebuild Phase 1 Status

on:
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'operations/quality-rebase/phase1/rebuild-status-request.json'
      - 'scripts/rebuild_phase1_status_v1.mjs'
      - '.github/workflows/rebuild-phase1-status.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-phase1-status
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout quality rebase branch
        uses: actions/checkout@v4
        with:
          ref: agent/quality-rebase-phase0-2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild Phase 1 status ledgers
        run: node scripts/rebuild_phase1_status_v1.mjs

      - name: Validate no false approvals
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('operations/quality-rebase/phase1/current-status-v1.json', 'utf8'));
          const expected = {
            primaryReviewComplete: 20,
            independentReviewReady: 17,
            additionalSourceMappingRequired: 3,
            sourceIdentityConflictBlocked: 1,
            deepVerificationApproved: 0,
          };
          for (const [key, value] of Object.entries(expected)) if (status.counts[key] !== value) process.exit(1);
          if (status.automaticDeepApprovalAllowed !== false) process.exit(1);
          console.log(JSON.stringify(status.counts, null, 2));
          NODE

      - name: Commit reconciled ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            operations/quality-rebase/phase1/batch01-status-v1.json \
            operations/quality-rebase/phase1/batch02-status-v1.json \
            operations/quality-rebase/phase1/batch03-status-v1.json \
            operations/quality-rebase/phase1/current-status-v1.json
          if git diff --cached --quiet; then
            echo 'No status changes to commit.'
          else
            git commit -m 'quality: reconcile Phase 1 review status'
            git push origin HEAD:agent/quality-rebase-phase0-2
          fi

      - name: Upload current status
        uses: actions/upload-artifact@v4
        with:
          name: phase1-current-status
          if-no-files-found: error
          retention-days: 90
          path: |
            operations/quality-rebase/phase1/current-status-v1.json
            operations/quality-rebase/phase1/batch01-status-v1.json
            operations/quality-rebase/phase1/batch02-status-v1.json
            operations/quality-rebase/phase1/batch03-status-v1.json

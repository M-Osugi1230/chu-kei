name: Apply Quality Rebase Phase 0

on:
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'operations/quality-rebase/apply-phase0-request.json'
      - '.github/workflows/apply-quality-rebase-phase0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-quality-rebase-phase0
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout quality rebase branch
        uses: actions/checkout@v4
        with:
          ref: agent/quality-rebase-phase0-2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Phase 0 quality rebase
        run: node scripts/apply_quality_rebase_phase0_v1.mjs

      - name: Validate generated state
        run: |
          git status --short
          test -f operations/quality-rebase/phase0-application-result-v1.json
          test -f site/data/quality-rebase-v1.json
          node -e "const r=require('./operations/quality-rebase/phase0-application-result-v1.json'); if(r.deepVerified!==0||r.phase2Target!==500||r.reAuditPool!==315||r.templateReviewRequired!==2685) process.exit(1)"

      - name: Commit generated quality rebase state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md scripts site operations reports artifacts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'quality: apply Phase 0 truth rebase to public data'
            git push origin HEAD:agent/quality-rebase-phase0-2
          fi

      - name: Upload application reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-rebase-phase0-application
          if-no-files-found: error
          path: |
            operations/quality-rebase/phase0-application-result-v1.json
            operations/quality-rebase/phase0-audit-report-v1.json
            operations/quality-rebase/phase0-definition-reconciliation-v1.json
            operations/quality-rebase/phase1-cohort-50-v1.json
            operations/quality-rebase/phase2-queue-500-v1.json
            operations/production-quality/production-readiness-v1.json
            reports/v43/QUALITY_SCORE_V3_REPORT.json
            artifacts/quality-score-v2-validation.json

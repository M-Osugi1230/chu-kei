name: Phase 2 Primary Review Wave Gate

on:
  pull_request:
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-review-wave:
    name: validate-primary-review-wave-${{ matrix.wave }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        wave:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - '09'
          - '10'
          - '11'
          - '12'
          - '13'
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate queue integrity and approval safety
        run: |
          python scripts/validate_phase2_primary_review_wave_v4.py \
            --wave operations/quality-rebase/phase2/primary-review-wave${{ matrix.wave }}-v1.json \
            --status operations/quality-rebase/phase2/current-status-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave07-primary-completion-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave08-primary-completion-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave09-primary-completion-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave10-primary-completion-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave11-primary-completion-v1.json \
            --overlay operations/quality-rebase/phase2/review-state-overlays/wave12-primary-completion-v1.json \
            --repo-root .

name: Phase 1 Primary Review Gate

on:
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'operations/quality-rebase/phase1/**'
      - 'scripts/validate_phase1_primary_reviews_v1.mjs'
      - '.github/workflows/phase1-primary-review-gate.yml'
  pull_request:
    paths:
      - 'operations/quality-rebase/phase1/**'
      - 'scripts/validate_phase1_primary_reviews_v1.mjs'
      - '.github/workflows/phase1-primary-review-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Phase 1 primary review ledgers
        run: node scripts/validate_phase1_primary_reviews_v1.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-primary-review-validation
          if-no-files-found: error
          retention-days: 90
          path: artifacts/quality-rebase/phase1-primary-review-validation-v1.json

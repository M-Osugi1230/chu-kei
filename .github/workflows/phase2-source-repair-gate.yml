name: Phase 2 Source Repair Gate

on:
  pull_request:
    paths:
      - 'operations/quality-rebase/phase2/source-repairs/*-source-resolution-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'scripts/validate_phase2_source_repairs.py'
      - '.github/workflows/phase2-source-repair-gate.yml'
  push:
    branches:
      - agent/quality-rebase-phase0-2
    paths:
      - 'operations/quality-rebase/phase2/source-repairs/*-source-resolution-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'scripts/validate_phase2_source_repairs.py'
      - '.github/workflows/phase2-source-repair-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source quarantine and approval safety
        run: |
          python scripts/validate_phase2_source_repairs.py \
            --repo-root . \
            --status operations/quality-rebase/phase2/current-status-v1.json

name: Phase 2 Primary Review Wave Gate

on:
  pull_request:
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/effective-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v*.json'
      - 'operations/quality-rebase/phase2/primary-reviews/*-primary-review-v*.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'operations/quality-rebase/phase2/wave-assignment-dedup-audit-v1.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - 'scripts/validate_phase2_primary_review_ledger_v1.py'
      - 'scripts/validate_phase2_primary_review_ledger_v2.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  push:
    branches:
      - main
      - 'agent/phase2-*'
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/effective-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v*.json'
      - 'operations/quality-rebase/phase2/primary-reviews/*-primary-review-v*.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'operations/quality-rebase/phase2/wave-assignment-dedup-audit-v1.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - 'scripts/validate_phase2_primary_review_ledger_v1.py'
      - 'scripts/validate_phase2_primary_review_ledger_v2.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-review-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check validator syntax
        run: python -m py_compile scripts/validate_phase2_primary_review_ledger_v1.py scripts/validate_phase2_primary_review_ledger_v2.py

      - name: Validate canonical Phase 2 review ledger
        run: python scripts/validate_phase2_primary_review_ledger_v2.py --repo-root .

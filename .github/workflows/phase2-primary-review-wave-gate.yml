name: Phase 2 Primary Review Wave Gate

on:
  pull_request:
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - 'scripts/validate_phase2_primary_review_wave_v5.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  push:
    branches:
      - main
      - 'agent/phase2-*'
    paths:
      - 'operations/quality-rebase/phase2/primary-review-wave*-v1.json'
      - 'operations/quality-rebase/phase2/current-status-v1.json'
      - 'operations/quality-rebase/phase2/review-state-overlays/*.json'
      - 'operations/quality-rebase/phase2/reviews/*-primary-review-v1.json'
      - 'operations/quality-rebase/phase2/independent/*-independent-review-v*.json'
      - 'operations/quality-rebase/phase2/source-repairs/*.json'
      - 'scripts/validate_phase2_primary_review_wave.py'
      - 'scripts/validate_phase2_primary_review_wave_v2.py'
      - 'scripts/validate_phase2_primary_review_wave_v3.py'
      - 'scripts/validate_phase2_primary_review_wave_v4.py'
      - 'scripts/validate_phase2_primary_review_wave_v5.py'
      - '.github/workflows/phase2-primary-review-wave-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-review-waves:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every existing wave and overlay
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t WAVES < <(find operations/quality-rebase/phase2 \
            -maxdepth 1 \
            -type f \
            -name 'primary-review-wave*-v1.json' \
            | sort)
          mapfile -t OVERLAYS < <(find operations/quality-rebase/phase2/review-state-overlays \
            -maxdepth 1 \
            -type f \
            -name 'wave*-primary-completion-v1.json' \
            | sort)

          if [[ ${#WAVES[@]} -eq 0 ]]; then
            echo 'No Phase 2 primary review waves found.' >&2
            exit 1
          fi

          OVERLAY_ARGS=()
          for overlay in "${OVERLAYS[@]}"; do
            OVERLAY_ARGS+=(--overlay "$overlay")
          done

          echo "Validating ${#WAVES[@]} waves with ${#OVERLAYS[@]} completion overlays."
          for wave in "${WAVES[@]}"; do
            echo "Validating $wave"
            python scripts/validate_phase2_primary_review_wave_v5.py \
              --wave "$wave" \
              --status operations/quality-rebase/phase2/current-status-v1.json \
              "${OVERLAY_ARGS[@]}" \
              --repo-root .
          done

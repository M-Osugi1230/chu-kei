name: Diagnose Phase 2 Wave Duplicates

on:
  push:
    branches:
      - agent/phase2-primary-wave25
    paths:
      - '.github/workflows/phase2-wave-duplicate-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect duplicate company and review states
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path('operations/quality-rebase/phase2')
          by_code = defaultdict(list)
          for path in sorted(root.glob('primary-review-wave*-v1.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for company in data.get('companies', []):
                  code = str(company.get('code', '')).strip()
                  by_code[code].append({
                      'wave': path.name,
                      'order': company.get('order'),
                      'name': company.get('name'),
                      'waveStatus': company.get('status'),
                  })
          for code, entries in sorted(by_code.items()):
              if not code or len(entries) <= 1:
                  continue
              review = root / 'reviews' / f'{code}-primary-review-v1.json'
              review_state = None
              review_role = None
              if review.is_file():
                  data = json.loads(review.read_text(encoding='utf-8'))
                  review_state = (data.get('review') or {}).get('status')
                  review_role = (data.get('review') or {}).get('reviewRole')
              print(json.dumps({
                  'code': code,
                  'entries': entries,
                  'reviewExists': review.is_file(),
                  'reviewStatus': review_state,
                  'reviewRole': review_role,
              }, ensure_ascii=False))
          PY

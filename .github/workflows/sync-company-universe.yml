name: Sync Company Universe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-company-universe.yml'
  schedule:
    - cron: '17 21 * * 1'

permissions:
  contents: write

concurrency:
  group: company-universe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Excel workbook parsers
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4' 'xlrd>=2,<3'

      - name: Fetch current JPX listed-company universe
        run: npm run company:coverage:fetch

      - name: Build current Prime Standard Growth universe
        run: npm run company:universe:build

      - name: Refresh verified plan detection overrides
        run: npm run company:plan-detection:verified-overrides:build

      - name: Refresh primary-reviewed plan detection overrides
        run: npm run company:plan-detection:primary-overrides:build

      - name: Refresh plan detection registry
        run: npm run company:plan-detection:build

      - name: Rebuild ADE research priority queue
        run: npm run company:research-priority:build

      - name: Rebuild frontend search data
        run: node scripts/build_frontend_data_shards_v1.mjs

      - name: Validate canonical static bundle without regenerating it
        run: |
          node scripts/validate_quality_v43.mjs
          node scripts/validate_public_launch_v1.mjs
          node scripts/validate_data_contract_v1.mjs

      - name: Validate refreshed universe and publication artifacts
        run: |
          node --test tests/test_plan_detection_validation_v1.js
          node scripts/audit_plan_detection_evidence_consistency_v1.mjs
          node scripts/validate_full_universe_frontend_v1.mjs
          node scripts/validate_frontend_budget_v1.mjs

      - name: Fail if the source bundle changed during a listing-only sync
        run: |
          if ! git diff --quiet -- site/data/bundle.manifest.json site/data/bundle.gz.part*; then
            echo "Source bundle unexpectedly mutated in listing-only JPX sync." >&2
            exit 1
          fi

      - name: Commit universe refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No universe changes."
            exit 0
          fi
          git config user.name "chu-kei-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            operations/research/jpx-listed-companies-latest.json \
            operations/universe/current-universe-v1.json \
            operations/plan-detection/verified-overrides-v1.json \
            operations/plan-detection/primary-reviewed-overrides-v1.json \
            operations/plan-detection/registry-v1.json \
            operations/plan-detection/research-queue-v1.json \
            operations/research-priority/current-v1.json \
            site/data/company-universe-v1.json \
            site/data/plan-detection-summary-v1.json \
            site/data/research-priority-summary-v1.json \
            site/data/frontend
          git commit -m "data: sync current JPX company universe"
          git push

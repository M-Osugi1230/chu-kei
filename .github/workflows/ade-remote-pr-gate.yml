name: ADE Remote PR Gate

on:
  workflow_run:
    workflows:
      - Chu-kei v43 Quality Gate
    types:
      - completed
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ade-remote-pr-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'schedule' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted gate from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ADE contract and merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/trusted/ade_remote_gate.py

name: Chu-kei Live Deployment Parity

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'

permissions:
  contents: read

concurrency:
  group: chu-kei-live-deployment-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed GitHub source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check public Site against latest source of truth
        run: node scripts/audit_live_deployment_parity_v1.mjs

      - name: Preserve explicit drift or verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chu-kei-live-parity-result
          path: artifacts/live-deployment-parity-v1.json
          if-no-files-found: warn
          retention-days: 30
